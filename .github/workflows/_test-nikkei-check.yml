name: TEST nikkei session check (temporary, delete after verifying)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Try nikkei session
        env:
          NIKKEI_STATE_TEST: ${{ secrets.NIKKEI_STATE_TEST }}
        run: |
          set -e
          echo "$NIKKEI_STATE_TEST" > /tmp/nikkei_state.json
          python3 - <<'PYEOF'
          import json
          from playwright.sync_api import sync_playwright

          PAYWALL_MARKERS = ["この先を読むには", "会員登録", "ログインしてください", "有料会員"]

          with open("/tmp/nikkei_state.json") as f:
              state = json.load(f)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(storage_state=state)
              page = context.new_page()
              page.goto("https://www.nikkei.com/", timeout=30000)
              print("TOP_TITLE:", page.title())

              # try to find an article link and open it
              links = page.eval_on_selector_all(
                  "a[href*='/article/']",
                  "els => els.slice(0,5).map(e => e.href)"
              )
              print("ARTICLE_LINKS_FOUND:", len(links))
              if links:
                  page.goto(links[0], timeout=30000)
                  print("ARTICLE_TITLE:", page.title())
                  body_text = page.inner_text("body")[:2000]
                  hit = [m for m in PAYWALL_MARKERS if m in body_text]
                  print("PAYWALL_MARKERS_FOUND:", hit)
                  print("BODY_SNIPPET_LEN:", len(body_text))
              browser.close()
          PYEOF
          rm -f /tmp/nikkei_state.json
